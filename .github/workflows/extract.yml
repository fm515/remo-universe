name: Extract REMO UNIVERSE ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract.yml"
      - "remo-universe-foundation-v0.1.0(1).zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          ZIP_FILE="remo-universe-foundation-v0.1.0(1).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p /tmp/remo-extract
          unzip -q "$ZIP_FILE" -d /tmp/remo-extract

          SOURCE="/tmp/remo-extract/remo-universe-foundation"

          if [ ! -d "$SOURCE" ]; then
            echo "ERROR: Project folder not found inside ZIP"
            exit 1
          fi

          cp -a "$SOURCE/." .
          rm "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract REMO UNIVERSE foundation"
            git push
          fi
