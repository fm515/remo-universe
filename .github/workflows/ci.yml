name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Module boundaries
        run: npm run check:boundaries
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
